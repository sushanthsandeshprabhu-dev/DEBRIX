name: Verify DEBRIX
on:
  pull_request:
  push:
    branches: [main]
jobs:
  workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node --check server.mjs && find api -name '*.mjs' -print0 | xargs -0 -n1 node --check && node --check public/app.js
      - run: npm test
