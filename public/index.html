<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f6f7f2" />
  <title>DEBRIX × AIRWISE | Bengaluru circular materials network</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#" aria-label="DEBRIX and AIRWISE home"><span class="brand-mark"><i></i><i></i><i></i></span><span><strong>urban<span class="brand-x">×</span>loop</strong><small>BENGALURU · PILOT</small></span></a>
      <div class="workspace-label">WORKSPACE</div>
      <div class="role-picker" role="tablist" aria-label="Choose a demo role">
        <button class="role-option active" data-role="citizen"><span class="role-icon">⌂</span><span>Citizen</span><span class="role-check">●</span></button>
        <button class="role-option" data-role="operator"><span class="role-icon">↗</span><span>Operator</span><span class="role-check">●</span></button>
        <button class="role-option" data-role="recycler"><span class="role-icon">⟳</span><span>Recycler</span><span class="role-check">●</span></button>
        <button class="role-option" data-role="authority"><span class="role-icon">▦</span><span>City operations</span><span class="role-check">●</span></button>
      </div>
      <div class="sidebar-rule"></div>
      <div class="workspace-label">YOUR NETWORK</div>
      <nav class="nav-list" id="nav-list"></nav>
      <div class="sidebar-bottom">
        <div class="pilot-note"><span class="pilot-dot"></span><div><b>Prototype environment</b><small>Some records are seeded demo data</small></div></div>
        <div class="profile"><div class="avatar" id="avatar">A</div><div class="profile-info"><b id="profile-name">Ananya Rao</b><small id="profile-role">Citizen account</small></div><button class="more-button" aria-label="More options">···</button></div>
      </div>
    </aside>
    <main class="main-area">
      <header class="topbar"><div class="breadcrumbs"><span>Urban materials</span><span class="crumb-sep">/</span><strong id="crumb-current">My dashboard</strong></div><div class="topbar-actions"><span class="connection"><i></i> Database connected</span><button class="icon-button" id="refresh-button" title="Refresh data" aria-label="Refresh data">↻</button><div class="top-avatar" id="top-avatar">A</div></div></header>
      <div id="view" class="view" aria-live="polite"><div class="loading"><span class="spinner"></span> Loading your workspace…</div></div>
      <footer class="footer"><span>URBANLOOP PILOT · BENGALURU</span><span>Material traceability <i class="footer-dot"></i> air context <i class="footer-dot"></i> verified outcomes</span></footer>
    </main>
  </div>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <dialog id="detail-dialog" class="detail-dialog"><form method="dialog"><button class="dialog-close" aria-label="Close">×</button></form><div id="dialog-content"></div></dialog>
  <script src="/app.js" defer></script>
</body>
</html>
