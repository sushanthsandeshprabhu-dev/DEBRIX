<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f5f6f1" />
  <meta name="description" content="DEBRIX connects construction and demolition waste pickup, transport, recovery and reuse." />
  <title>DEBRIX — Circular materials, connected</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/market-stock.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#home" aria-label="DEBRIX home"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span><strong>DEBRIX</strong><small> CIRCULAR MATERIALS</small></span></a>
      <div class="workspace-label" id="workspace-label">CITIZEN PORTAL</div>
      <div class="sidebar-network"><span class="network-dot"></span><div><strong>Bengaluru pilot</strong><small>Shared operations ledger</small></div></div>
      <div class="sidebar-rule"></div>
      <div class="workspace-label">YOUR WORKSPACE</div>
      <nav class="nav-list" id="nav-list" aria-label="Main navigation"></nav>
      <div class="sidebar-bottom">
        <div class="pilot-note"><span class="pilot-dot"></span><div><b>Prototype environment</b><small>Seeded records are labelled DEMO</small></div></div>
        <div class="profile"><div class="avatar" id="avatar">A</div><div class="profile-info"><b id="profile-name">Ananya Rao</b><small id="profile-role">Citizen</small></div></div>
      </div>
    </aside>
    <main class="main-area">
      <header class="topbar">
        <div class="breadcrumbs"><span>DEBRIX</span><span class="crumb-sep">/</span><strong id="crumb-current">Overview</strong></div>
        <div class="topbar-actions">
          <span class="sync-state" id="sync-state"><i></i><span>Connecting</span></span>
          <button class="icon-button" id="refresh-button" title="Refresh data" aria-label="Refresh data">↻</button>
          <button class="icon-button theme-toggle" id="theme-button" title="Switch theme" aria-label="Switch to dark theme">◐</button>
          <div class="portal-switch" role="group" aria-label="Portal access">
            <button class="portal-button active" id="citizen-portal">Citizen</button>
            <button class="portal-button" id="admin-portal">Admin sign in</button>
          </div>
          <div class="admin-tools hidden" id="admin-tools">
            <label class="sr-only" for="admin-role">Administrator workspace</label>
            <select id="admin-role" aria-label="Administrator workspace"><option value="operator">Operator</option><option value="recycler">Recycler</option></select>
            <button class="text-button" id="logout-button">Sign out</button>
          </div>
        </div>
      </header>
      <section id="view" class="view" aria-live="polite"><div class="loading"><span class="spinner"></span> Loading DEBRIX…</div></section>
      <footer class="footer"><span>DEBRIX · BENGALURU PILOT</span><span>Collection → transport → recovery → reuse</span></footer>
    </main>
  </div>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <dialog id="detail-dialog" class="detail-dialog"><form method="dialog"><button class="dialog-close" aria-label="Close">×</button></form><div id="dialog-content"></div></dialog>
  <dialog id="login-dialog" class="login-dialog"><form method="dialog"><button class="dialog-close" aria-label="Close">×</button></form><div id="login-content"></div></dialog>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="" defer></script>
  <script src="/app.js" defer></script>
</body>
</html>
